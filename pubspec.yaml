name: salepilot_desktop
description: "SalePilot POS Desktop"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # HTTP
  dio: ^5.7.0

  # Local DB
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Connectivity
  connectivity_plus: ^6.1.0

  # Receipts
  pdf: ^3.11.1
  printing: ^5.13.4

  # Misc
  uuid: ^4.5.1
  intl: ^0.20.1
  window_manager: ^0.4.3
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.13
  drift_dev: ^2.20.3

  # Windows installer
  msix: ^3.16.8

flutter:
  uses-material-design: true

# Windows installer config — see https://pub.dev/packages/msix
# Build with: dart run msix:create
#
# For SIGNED, distributable builds you must additionally set:
#   publisher: 'CN=YourCompany, O=YourCompany, C=US'   (X.500 from your cert)
#   certificate_path: path\to\cert.pfx
#   certificate_password: <password>
#
# For unsigned / sideload installs on machines with "Developer Mode" or
# "Sideload apps" enabled, the defaults below are sufficient.
msix_config:
  display_name: SalePilot POS
  publisher_display_name: SalePilot
  identity_name: com.salepilot.desktop
  msix_version: 1.0.0.0
  architecture: x64
  capabilities: internetClient, privateNetworkClientServer
  logo_path: windows\runner\resources\app_icon.ico
  store: false
  output_path: build\msix
  output_name: SalePilotPOS
